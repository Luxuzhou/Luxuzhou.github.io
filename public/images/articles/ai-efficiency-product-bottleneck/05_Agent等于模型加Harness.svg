    <text x="205" y="380" text-anchor="middle" font-size="28" font-weight="700">Model</text>
    <text x="205" y="410" text-anchor="middle" font-size="18">生成 · 推理</text>
    <text x="385" y="290" text-anchor="middle" font-size="42">＋</text>
    <text x="650" y="105" text-anchor="middle" font-size="27" font-weight="700" fill="#3BAA8C">Harness 外部工程系统</text>
    <g font-size="21" text-anchor="middle"><text x="552" y="216">约束</text><text x="747" y="216">工具 / MCP</text><text x="552" y="316">上下文</text><text x="747" y="316">记忆</text><text x="552" y="416">验证</text><text x="747" y="416">编排</text></g>
    <text x="920" y="290" text-anchor="middle" font-size="42">＝</text>
    <text x="1047" y="250" text-anchor="middle" font-size="27" font-weight="700">可用的</text>
    <text x="1047" y="285" text-anchor="middle" font-size="27" font-weight="700">Agent</text>
    <text x="600" y="565" text-anchor="middle" font-size="28" font-weight="700">模型决定能力上限，Harness 决定它能否稳定上路</text>
    <path d="M250 605 Q600 635 950 605" fill="none" stroke="#F2A340" stroke-width="5" stroke-linecap="round" filter="url(#rough)"/>
